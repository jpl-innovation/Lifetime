# Lifetime Server settings, read when the service starts (/etc/lifetime-server/server.conf).
# After a change: sudo ./restart_server_linux.sh
# The address computers use to reach this server; its name goes into the server's certificate.
LIFETIME_ADDRESS=https://localhost:8443
# Where the HTTPS listener binds (0.0.0.0 = every IPv4 address of this server) and its port.
LIFETIME_HOST=0.0.0.0
LIFETIME_PORT=8443
# Loopback administration port (127.0.0.1 only; never open it in a firewall).
LIFETIME_ADMIN_PORT=8444
