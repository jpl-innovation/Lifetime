name: Server CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - name: Install server test dependencies
        run: python -m pip install -r requirements-server.txt PyQt6
      - name: Run unit tests (no SCM/service installation)
        run: python -m unittest discover -v
  windows-server-package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build separate server package
        shell: pwsh
        run: ./build_server_windows.ps1
      - name: Archive server package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Directory -Filter 'server-package-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Compress-Archive -Path (Join-Path $package.FullName '*') -DestinationPath Lifetime-Server-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lifetime-Server-Windows
          path: Lifetime-Server-Windows.zip
