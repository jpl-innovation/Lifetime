name: Test, build and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      LIFETIME_DATA_DIR: ${{ github.workspace }}/.test-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - name: Install dependencies (desktop + server)
        run: python -m pip install -r requirements-server.txt -r requirements-desktop.txt
      - name: All tests
        run: python -m unittest discover -v
      - name: Parse PowerShell installers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem install_*.ps1, uninstall_*.ps1, build_*.ps1, restart_*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Parse Linux scripts
        if: runner.os == 'Linux'
        run: |
          for script in install_linux.sh uninstall_linux.sh install_server_linux.sh uninstall_server_linux.sh \
                        restart_server_linux.sh packaging/linux/build_linux.sh packaging/linux/smoke_test.sh \
                        packaging/linux/pairing_test.sh; do
            bash -n "$script"
          done
          sh -n packaging/linux/lifetime-server.sysv
          sh -n packaging/linux/AppRun

  rust-accelerator:
    # The server's optional Rust accelerator (rust/lifetime_fast, docs/notes/1.3.0-rust.md), in its own job so that a
    # Rust problem never stops the Python tests or the desktop and agent packages: only the server packages and the
    # release wait for it. Exact Rust, maturin and crate (Cargo.lock) versions. The comparison with the Python
    # reference may not skip here; then once forced back to Python; then both engines' speed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.11'      # the oldest Python the abi3-py311 build promises
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install server dependencies
        run: python -m pip install -r requirements-server.txt
      - name: Build the Rust accelerator
        shell: bash
        run: |
          rustup toolchain install 1.91.0 --profile minimal --no-self-update
          rustup default 1.91.0
          manifest=rust/lifetime_fast/Cargo.toml
          if ! cargo metadata --locked --format-version 1 --manifest-path "$manifest" >/dev/null; then
            echo "Cargo.lock does not match Cargo.toml. The smallest change cargo wants (check it, then commit it):"
            cargo metadata --format-version 1 --manifest-path "$manifest" >/dev/null && git diff -- rust/lifetime_fast/Cargo.lock
            exit 1
          fi
          python -m pip install --disable-pip-version-check maturin==1.10.2
          python -m maturin build --release --locked --interpreter python -m "$manifest" --out build/rust-wheels
          python -m pip install --disable-pip-version-check --force-reinstall --no-deps --no-index --find-links=build/rust-wheels lifetime_fast==0.1.0
      - name: Compare with the Python reference, then forced to Python, then the speed of both
        shell: bash
        env:
          LIFETIME_REQUIRE_RUST: '1'
        run: |
          python -m unittest -v test_availability_engines test_availability test_monitor
          LIFETIME_NO_RUST=1 python -m unittest -v test_availability_engines test_availability
          python tools/availability_speed.py

  windows-package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build executables
        shell: pwsh
        run: ./build_windows.ps1
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath Lifetime-Windows.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lifetime-Windows
          path: Lifetime-Windows.zip

  linux-build:
    # Bundles built in Rocky Linux 8 (glibc 2.28) run on every newer glibc distribution. aarch64: server only, because
    # PyQt6's aarch64 wheels need a newer glibc than 2.28. Waits for the Rust accelerator: the server bundles carry it.
    needs: [test, rust-accelerator]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            build: build
          - arch: aarch64
            runner: ubuntu-24.04-arm
            build: build --server-only
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build bundles in Rocky Linux 8
        # LIFETIME_RUST=1: the server runtime gets the Rust accelerator, built in the container on glibc 2.28, or fails.
        run: docker run --rm -e LIFETIME_RUST=1 -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -v "$PWD:/src" -w /src rockylinux:8 bash packaging/linux/build_linux.sh ${{ matrix.build }}
      - name: Package (AppImage, tar.gz)
        run: bash packaging/linux/build_linux.sh package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lifetime-Linux-${{ matrix.arch }}
          path: build-linux/out/*

  linux-smoke:
    # Every bundle in containers of the supported distributions: desktop self-check headless, tracker, server, enroll
    # and sync. Containers run without systemd, so these also exercise the non-systemd paths.
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:10', 'debian:11', 'debian:12', 'ubuntu:20.04', 'ubuntu:22.04', 'ubuntu:24.04', 'fedora:latest',
                'rockylinux:8', 'rockylinux:9', 'opensuse/leap:15', 'archlinux:latest']
        mode: [direct]
        include:
          - image: 'debian:12'
            mode: --installer
          - image: 'rockylinux:9'
            mode: --installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Lifetime-Linux-x86_64
          path: artifacts
      - name: Smoke test in ${{ matrix.image }} (${{ matrix.mode }})
        run: docker run --rm -v "$PWD:/src:ro" -w /src ${{ matrix.image }} bash packaging/linux/smoke_test.sh artifacts ${{ matrix.mode }}

  linux-pairing:
    # A Linux computer pairs with a Linux server by typing the code only (no --server): local discovery and the network
    # search, the paths that failed in 1.2.1. Two Ubuntu containers on one Docker network (two computers on a LAN), each
    # resolving its own name to 127.0.1.1 as Ubuntu does, and a server address name that does not resolve. A second
    # client has multicast blocked (a route set with the runner's sudo, no container privileges), so it proves the
    # network search on its own.
    needs: linux-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Lifetime-Linux-x86_64
          path: artifacts
      - name: Pair by code only (ubuntu:24.04 client and server)
        run: bash packaging/linux/pairing_test.sh artifacts ubuntu:24.04

  linux-docker:
    # The container image ("runs on every Linux"): non-root, data volume, admin over the Unix socket inside the
    # container, and a client on the host enrolls and syncs.
    needs: linux-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Lifetime-Linux-x86_64
          path: artifacts
      - name: Build image
        run: docker build -t lifetime-server:ci .
      - name: Run
        run: |
          docker volume create lifetime-smoke-data
          docker run -d --name lifetime-smoke -p 127.0.0.1:8443:8443 -e LIFETIME_ADDRESS=https://127.0.0.1:8443 \
            -v lifetime-smoke-data:/var/lib/lifetime-server lifetime-server:ci
          [ "$(docker exec lifetime-smoke id -u)" != 0 ]
      - name: Enroll and sync a client
        run: bash packaging/linux/smoke_test.sh artifacts --docker
      - name: Server log
        if: always()
        run: docker logs lifetime-smoke || true

  windows-server-package:
    needs: [test, rust-accelerator]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Rust 1.91.0 for the server's accelerator
        shell: bash
        run: rustup toolchain install 1.91.0 --profile minimal --no-self-update && rustup default 1.91.0
      - name: Build server package
        shell: pwsh
        run: ./build_server_windows.ps1 -WithRust
      - name: The packaged runtime loads the Rust accelerator
        shell: pwsh
        run: |
          $package = Get-ChildItem -Directory -Filter 'server-package-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $runtime = Join-Path $package.FullName 'LifetimeServerRuntime.exe'
          $data = Join-Path $env:RUNNER_TEMP 'lifetime-rust-check'
          $log = Join-Path $env:RUNNER_TEMP 'lifetime-rust-check.log'
          $server = Start-Process -FilePath $runtime -PassThru -NoNewWindow -RedirectStandardOutput "$log.out" -RedirectStandardError $log `
            -ArgumentList 'console', '--directory', $data, '--address', 'https://127.0.0.1:8443', '--host', '127.0.0.1', '--port', '8443', '--admin-port', '8444'
          try {
            $engine = $null
            foreach ($attempt in 1..90) {
              $engine = & $runtime admin --directory $data --admin-port 8444 --operation server_info --field availability_engine 2>$null
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 1
            }
            Write-Host "availability engine: $engine"
            if ($engine -ne 'Rust accelerator') {
              Get-Content -Tail 50 $log -ErrorAction SilentlyContinue
              throw 'The packaged Windows server runtime does not load the Rust accelerator.'
            }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Zip
        shell: pwsh
        run: |
          $package = Get-ChildItem -Directory -Filter 'server-package-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Compress-Archive -Path (Join-Path $package.FullName '*') -DestinationPath Lifetime-Server-Windows.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lifetime-Server-Windows
          path: Lifetime-Server-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-accelerator, windows-package, windows-server-package, linux-build, linux-smoke, linux-pairing, linux-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum Lifetime-Windows.zip Lifetime-Server-Windows.zip Lifetime-Linux-x86_64.AppImage Lifetime-Linux-x86_64.tar.gz Lifetime-Server-Linux-x86_64.tar.gz Lifetime-Server-Linux-aarch64.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Published files are never replaced: people may already have downloaded them and checked them against
          # SHA256SUMS.txt. A fix ships under a new version tag.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists. Its files are not replaced; tag a new version."
            exit 1
          fi
          # The release text is this version's section only (the first "## " heading up to the next one).
          awk '/^## /{n++} n==1' RELEASE_NOTES.md > release-text.md
          gh release create "$GITHUB_REF_NAME" Lifetime-Windows.zip Lifetime-Server-Windows.zip Lifetime-Linux-x86_64.AppImage Lifetime-Linux-x86_64.tar.gz Lifetime-Server-Linux-x86_64.tar.gz Lifetime-Server-Linux-aarch64.tar.gz SHA256SUMS.txt \
            --title "Lifetime $GITHUB_REF_NAME" --notes-file release-text.md
