name: Test, build and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      LIFETIME_DATA_DIR: ${{ github.workspace }}/.test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - name: Install dependencies (desktop + server)
        run: python -m pip install -r requirements-server.txt PyQt6
      - name: All tests
        run: python -m unittest discover -v
      - name: Parse PowerShell installers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem install_*.ps1, uninstall_*.ps1, build_*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Parse Linux installer
        if: runner.os == 'Linux'
        run: bash -n install_linux.sh

  windows-package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build executables
        shell: pwsh
        run: ./build_windows.ps1
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath Lifetime-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lifetime-Windows
          path: Lifetime-Windows.zip

  linux-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle
        run: |
          mkdir -p Lifetime-Linux/assets
          cp lifetime_*.py install_linux.sh README.md TECHNICIAN_VERIFICATION.md Lifetime-Linux/
          cp assets/*.png Lifetime-Linux/assets/
          chmod +x Lifetime-Linux/install_linux.sh
          tar -czf Lifetime-Linux.tar.gz Lifetime-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: Lifetime-Linux
          path: Lifetime-Linux.tar.gz

  windows-server-package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build server package
        shell: pwsh
        run: ./build_server_windows.ps1
      - name: Zip
        shell: pwsh
        run: |
          $package = Get-ChildItem -Directory -Filter 'server-package-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Compress-Archive -Path (Join-Path $package.FullName '*') -DestinationPath Lifetime-Server-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lifetime-Server-Windows
          path: Lifetime-Server-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-package, linux-package, windows-server-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum Lifetime-Windows.zip Lifetime-Linux.tar.gz Lifetime-Server-Windows.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Lifetime-Windows.zip Lifetime-Linux.tar.gz Lifetime-Server-Windows.zip SHA256SUMS.txt \
            --title "Lifetime $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
